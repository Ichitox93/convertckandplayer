<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velox Lite Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f4;
        }
        .player {
            width: 80%;
            max-width: 800px;
            height: 450px;
            background-color: #000;
            margin-bottom: 20px;
        }
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 80%;
            max-width: 800px;
        }
        .channel {
            background-color: #fff;
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 5px;
            transition: transform 0.2s;
        }
        .channel:hover {
            transform: scale(1.05);
        }
        @media (max-width: 768px) {
            .channel-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 480px) {
            .channel-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="player">
        <!-- Player code goes here -->
        <h2>Video Player</h2>
        <p>Player is loading...</p>
    </div>
    <div class="channel-grid">
        <div class="channel">Channel 1</div>
        <div class="channel">Channel 2</div>
        <div class="channel">Channel 3</div>
        <div class="channel">Channel 4</div>
        <div class="channel">Channel 5</div>
        <div class="channel">Channel 6</div>
        <div class="channel">Channel 7</div>
        <div class="channel">Channel 8</div>
        <div class="channel">Channel 9</div>
        <div class="channel">Channel 10</div>
    </div>
</body>
</html>
