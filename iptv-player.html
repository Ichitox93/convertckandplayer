<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Stream Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/shaka-player/dist/controls.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Material+Icons+Sharp" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0b0f;
      --surface: #111318;
      --surface2: #181b22;
      --border: #1e2230;
      --accent: #e63946;
      --accent2: #ff6b6b;
      --text: #e8eaf0;
      --text-dim: #6b7280;
      --text-muted: #374151;
      --green: #22c55e;
      --yellow: #eab308;
      --sidebar-w: 300px;
      --bottom-h: 100px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    #topbar {
      height: 48px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 100;
    }

    #topbar .logo {
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    #topbar .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #urlInput {
      flex: 1;
      height: 30px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 11px;
      padding: 0 10px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color .2s;
    }
    #urlInput:focus { border-color: var(--accent); }

    #loadBtn {
      height: 30px;
      padding: 0 14px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s;
    }
    #loadBtn:hover { background: var(--accent2); }

    #multiBtn, #epgBtn {
      height: 30px;
      padding: 0 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s;
    }
    #multiBtn:hover, #epgBtn:hover { border-color: var(--accent); color: var(--accent); }
    #multiBtn.active { background: #1a0a0a; border-color: var(--accent); color: var(--accent); }

    /* ── MAIN LAYOUT ── */
    #main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    #searchBox {
      padding: 10px;
      border-bottom: 1px solid var(--border);
    }

    #searchInput {
      width: 100%;
      height: 30px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 11px;
      padding: 0 10px;
      outline: none;
      font-family: 'Inter', sans-serif;
    }
    #searchInput:focus { border-color: var(--accent); }

    #groupTabs {
      display: flex;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      padding: 0 4px;
      gap: 2px;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    #groupTabs::-webkit-scrollbar { display: none; }

    .groupTab {
      padding: 6px 10px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dim);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: all .2s;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .groupTab:hover { color: var(--text); }
    .groupTab.active { color: var(--accent); border-bottom-color: var(--accent); }

    #channelList {
      flex: 1;
      overflow-y: auto;
      padding: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .channelItem {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s;
      position: relative;
    }
    .channelItem:hover { background: var(--surface2); }
    .channelItem.active { background: #1a0a0a; }
    .channelItem.active::before {
      content: '';
      position: absolute;
      left: 0; top: 4px; bottom: 4px;
      width: 3px;
      background: var(--accent);
      border-radius: 2px;
    }

    .chLogo {
      width: 36px; height: 26px;
      object-fit: contain;
      border-radius: 3px;
      background: var(--surface2);
      flex-shrink: 0;
    }

    .chInfo { flex: 1; min-width: 0; }
    .chName {
      font-size: 11px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chGroup {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 1px;
    }

    .addMultiBtn {
      width: 20px; height: 20px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
      line-height: 1;
    }
    .addMultiBtn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── CENTER AREA ── */
    #center {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── PLAYER ZONE ── */
    #playerZone {
      flex: 1;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    /* Single player */
    #singlePlayer {
      width: 100%; height: 100%;
      position: relative;
    }

    [data-shaka-player-container] {
      width: 100%; height: 100%;
    }

    #video {
      width: 100%; height: 100%;
      background: #000;
    }

    /* Multi-view grid */
    #multiGrid {
      display: none;
      width: 100%; height: 100%;
      gap: 2px;
      background: #000;
    }

    .multiCell {
      position: relative;
      background: #000;
      overflow: hidden;
      cursor: pointer;
    }

    .multiCell video {
      width: 100%; height: 100%;
      object-fit: contain;
    }

    .multiCell .cellLabel {
      position: absolute;
      top: 6px; left: 6px;
      background: rgba(0,0,0,.75);
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      pointer-events: none;
    }

    .multiCell .cellClose {
      position: absolute;
      top: 4px; right: 4px;
      width: 20px; height: 20px;
      background: rgba(230,57,70,.8);
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    .multiCell.focused { outline: 2px solid var(--accent); }

    /* Loading overlay */
    #loadingOverlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
    }
    #loadingOverlay.hidden { display: none; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loadingText {
      font-size: 12px;
      color: var(--text-dim);
    }

    /* Placeholder */
    #placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #000;
    }
    #placeholder .ph-icon {
      font-size: 48px;
      color: var(--text-muted);
      font-family: 'Material Icons Sharp';
    }
    #placeholder p {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Now playing bar */
    #nowPlaying {
      height: 40px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      flex-shrink: 0;
    }

    #nowPlaying .np-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.4s infinite;
      flex-shrink: 0;
    }
    #nowPlaying .np-dot.idle { background: var(--text-muted); animation: none; }

    #npName {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #npEpg {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    /* ── EPG PANEL ── */
    #epgPanel {
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 340px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 50;
      transform: translateX(100%);
      transition: transform .3s ease;
      display: flex;
      flex-direction: column;
    }
    #epgPanel.open { transform: translateX(0); }

    #epgHeader {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #epgHeader h3 {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      font-family: 'Orbitron', monospace;
      letter-spacing: 1px;
    }
    #epgClose {
      width: 26px; height: 26px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }

    #epgContent {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    #epgChannelName {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .epgItem {
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 4px;
      border-left: 3px solid transparent;
    }
    .epgItem.now {
      background: #1a0a0a;
      border-left-color: var(--accent);
    }
    .epgItem .epgTime {
      font-size: 10px;
      color: var(--text-dim);
      font-weight: 600;
      font-family: 'Orbitron', monospace;
    }
    .epgItem.now .epgTime { color: var(--accent); }
    .epgItem .epgTitle {
      font-size: 11px;
      color: var(--text);
      margin-top: 2px;
    }
    .epgItem.now .epgTitle { font-weight: 600; }
    .epgItem .epgBadge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 700;
      margin-left: 5px;
    }

    #epgNoData {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      padding: 30px 0;
    }

    /* ── STATUS BAR ── */
    #statusBar {
      height: 26px;
      background: #0d0e12;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 16px;
      flex-shrink: 0;
    }
    .sbItem {
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sbItem span { color: var(--text-dim); }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      padding: 8px 16px;
      border-radius: 8px;
      opacity: 0;
      transition: all .3s;
      pointer-events: none;
      z-index: 9999;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      #sidebar { width: 220px; }
      :root { --sidebar-w: 220px; }
      #epgPanel { width: 260px; }
    }

    /* Multi layout modes */
    .grid-1 { display: grid; grid-template-columns: 1fr; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .grid-3 .multiCell:first-child { grid-column: 1 / -1; }
    .grid-4 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

    /* Shaka overrides */
    .shaka-overflow-menu,
    .shaka-settings-menu {
      background-color: rgba(0,0,0,.8);
      backdrop-filter: blur(10px);
      border-radius: 8px;
    }
    .shaka-overflow-menu button:hover,
    .shaka-settings-menu button:hover {
      background-color: rgba(255,255,255,.1);
    }
    .shaka-spinner svg { stroke: var(--accent); }
    .shaka-controls-container[casting="true"] .shaka-overflow-menu,
    .shaka-controls-container[casting="true"] .shaka-settings-menu,
    .shaka-controls-container[shown="true"] .shaka-overflow-menu,
    .shaka-controls-container[shown="true"] .shaka-settings-menu {
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.2) transparent;
    }

    /* channel count badge */
    .chCount {
      font-size: 9px;
      background: var(--surface2);
      color: var(--text-dim);
      padding: 1px 5px;
      border-radius: 10px;
      margin-left: 4px;
    }
  </style>
</head>

    </div>

</div>

<!-- Toast -->

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shaka-player/dist/shaka-player.ui.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mux.js/6.3.0/mux.min.js" crossorigin="anonymous"></script>

<script>
// ──────────────────────────────────────────────
// STATE
// ──────────────────────────────────────────────
let channels = [];
let groups = [];
let currentGroup = 'ALL';
let searchQuery = '';
let mainPlayer = null;
let mainUI = null;
let currentChannel = null;
let multiMode = false;
let multiPlayers = []; // [{player, channel}]
let epgData = {}; // tvg-id -> [{start, end, title, desc}]
let epgUrls = [];
let epgOpen = false;

// ──────────────────────────────────────────────
// INIT SHAKA
// ──────────────────────────────────────────────
async function initShaka() {
  shaka.polyfill.installAll();
  if (!shaka.Player.isBrowserSupported()) {
    showToast('Browser tidak mendukung Shaka Player');
    return;
  }

  const video = document.getElementById('video');
  const ui = video.ui;
  mainUI = ui;
  const controls = ui.getControls();
  mainPlayer = controls.getPlayer();

  mainPlayer.addEventListener('error', (e) => {
    console.error('Shaka error', e.detail);
    hideLoading();
    showToast('Gagal memuat stream: ' + (e.detail?.message || 'error'));
  });

  mainPlayer.addEventListener('buffering', (e) => {
    if (e.buffering) showLoading('Buffering...');
    else hideLoading();
  });
}

// ──────────────────────────────────────────────
// PARSE M3U
// ──────────────────────────────────────────────
function parseM3U(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const result = [];
  let current = null;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    if (line.startsWith('#EXTINF')) {
      current = {
        name: '',
        logo: '',
        group: 'Lainnya',
        tvgId: '',
        url: '',
        clearKey: null,
        headers: {}
      };

      // Parse name (after last comma)
      const commaIdx = line.lastIndexOf(',');
      if (commaIdx !== -1) current.name = line.substring(commaIdx + 1).trim();

      // Parse attributes
      const attrMatch = line.match(/tvg-logo="([^"]*)"/);
      if (attrMatch) current.logo = attrMatch[1];

      const groupMatch = line.match(/group-title="([^"]*)"/);
      if (groupMatch) current.group = groupMatch[1] || 'Lainnya';

      const tvgIdMatch = line.match(/tvg-id="([^"]*)"/);
      if (tvgIdMatch) current.tvgId = tvgIdMatch[1];

    } else if (current && line.startsWith('#KODIPROP:inputstream.adaptive.license_key=')) {
      const val = line.split('=').slice(1).join('=').trim();
      // Simple clearkey: keyId:key
      if (val && val.includes(':') && !val.startsWith('{') && val !== '0:0') {
        const parts = val.split(':');
        if (parts.length === 2) {
          current.clearKey = { keyId: parts[0], key: parts[1] };
        }
      }
    } else if (current && line.startsWith('#EXTVLCOPT:http-user-agent=')) {
      current.headers['User-Agent'] = line.replace('#EXTVLCOPT:http-user-agent=', '').trim();
    } else if (current && line.startsWith('#EXTVLCOPT:http-referrer=')) {
      current.headers['Referer'] = line.replace('#EXTVLCOPT:http-referrer=', '').trim();
    } else if (current && line.startsWith('#EXTVLCOPT:http-origin=')) {
      current.headers['Origin'] = line.replace('#EXTVLCOPT:http-origin=', '').trim();
    } else if (current && !line.startsWith('#') && line.length > 5) {
      current.url = line;
      if (current.name) result.push({ ...current });
      current = null;
    }
  }

  return result;
}

// ──────────────────────────────────────────────
// LOAD PLAYLIST
// ──────────────────────────────────────────────
async function loadPlaylist(url) {
  showToast('Memuat playlist...');
  showLoading('Memuat playlist...');
  try {
    // Try fetch with CORS proxy fallback
    let text = '';
    try {
      const resp = await fetch(url, { mode: 'cors' });
      if (resp.ok) text = await resp.text();
      else throw new Error('fetch failed');
    } catch {
      // Try corsproxy
      const proxy = 'https://corsproxy.io/?' + encodeURIComponent(url);
      const resp2 = await fetch(proxy);
      if (!resp2.ok) throw new Error('Gagal mengambil playlist');
      text = await resp2.text();
    }

    if (!text.includes('#EXTM3U') && !text.includes('#EXTINF')) {
      // Might be a direct stream URL
      hideLoading();
      await playChannel({ name: 'Direct Stream', url, group: 'Live', logo: '', clearKey: null, headers: {} });
      return;
    }

    channels = parseM3U(text);

    // Extract EPG URLs
    const epgMatch = text.match(/url-tvg="([^"]*)"/);
    if (epgMatch) {
      epgUrls = epgMatch[1].split(',').map(u => u.trim()).filter(Boolean);
    }

    buildGroupTabs();
    renderChannelList();
    hideLoading();

    document.getElementById('sbCount').textContent = channels.length;
    document.getElementById('sbGroups').textContent = groups.length;

    showToast(`✓ ${channels.length} saluran dari ${groups.length} grup dimuat`);

    // Auto-play first channel
    if (channels.length > 0) {
      setTimeout(() => playChannel(channels[0]), 300);
    }

  } catch (err) {
    hideLoading();
    showToast('Error: ' + err.message);
  }
}

// ──────────────────────────────────────────────
// BUILD UI
// ──────────────────────────────────────────────
function buildGroupTabs() {
  const groupSet = new Set(['ALL']);
  channels.forEach(c => groupSet.add(c.group));
  groups = [...groupSet];

  const container = document.getElementById('groupTabs');
  container.innerHTML = '';
  groups.forEach(g => {
    const count = g === 'ALL' ? channels.length : channels.filter(c => c.group === g).length;
    const tab = document.createElement('div');
    tab.className = 'groupTab' + (g === currentGroup ? ' active' : '');
    tab.innerHTML = g + (count > 0 ? `<span class="chCount">${count}</span>` : '');
    tab.addEventListener('click', () => {
      currentGroup = g;
      document.querySelectorAll('.groupTab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      renderChannelList();
    });
    container.appendChild(tab);
  });
}

function renderChannelList() {
  const q = searchQuery.toLowerCase();
  let filtered = channels.filter(c => {
    const matchGroup = currentGroup === 'ALL' || c.group === currentGroup;
    const matchSearch = !q || c.name.toLowerCase().includes(q);
    return matchGroup && matchSearch;
  });

  const list = document.getElementById('channelList');
  if (filtered.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:11px;">Tidak ada saluran ditemukan</div>';
    return;
  }

  list.innerHTML = '';
  filtered.forEach((ch, idx) => {
    const item = document.createElement('div');
    item.className = 'channelItem' + (currentChannel && currentChannel.url === ch.url ? ' active' : '');
    item.dataset.idx = channels.indexOf(ch);

    const logoSrc = ch.logo || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 26"><rect fill="%23181b22" width="36" height="26"/><text x="50%" y="55%" text-anchor="middle" dy=".35em" fill="%23374151" font-size="8" font-family="sans-serif">TV</text></svg>';

    item.innerHTML = `
      <img class="chLogo" src="${logoSrc}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=\\"http://www.w3.org/2000/svg\\" viewBox=\\"0 0 36 26\\"><rect fill=\\"%23181b22\\" width=\\"36\\" height=\\"26\\"/><text x=\\"50%\\" y=\\"55%\\" text-anchor=\\"middle\\" dy=\\".35em\\" fill=\\"%23374151\\" font-size=\\"8\\" font-family=\\"sans-serif\\">TV</text></svg>'">
      <div class="chInfo">
        <div class="chName">${escHtml(ch.name)}</div>
        <div class="chGroup">${escHtml(ch.group)}</div>
      </div>
      ${multiMode ? '<button class="addMultiBtn" title="Tambah ke multi-view">+</button>' : ''}
    `;

    item.addEventListener('click', (e) => {
      if (e.target.classList.contains('addMultiBtn')) {
        addToMulti(ch);
        return;
      }
      if (multiMode) {
        addToMulti(ch);
      } else {
        playChannel(ch);
      }
    });

    if (item.querySelector('.addMultiBtn')) {
      item.querySelector('.addMultiBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        addToMulti(ch);
      });
    }

    list.appendChild(item);
  });
}

// ──────────────────────────────────────────────
// PLAY CHANNEL (single mode)
// ──────────────────────────────────────────────
async function playChannel(ch) {
  if (!mainPlayer) return;
  currentChannel = ch;

  document.getElementById('placeholder').style.display = 'none';
  showLoading('Memuat ' + ch.name + '...');

  // Update sidebar active
  document.querySelectorAll('.channelItem').forEach(el => {
    el.classList.toggle('active', channels[el.dataset.idx]?.url === ch.url);
  });

  // Update now playing
  document.getElementById('npDot').classList.remove('idle');
  document.getElementById('npName').textContent = ch.name;
  document.getElementById('npEpg').textContent = '';

  // Stop previous
  try { await mainPlayer.unload(); } catch {}

  const config = buildConfig(ch);
  mainPlayer.configure(config);

  try {
    await mainPlayer.load(ch.url);
    hideLoading();
    showToast('▶ ' + ch.name);
    updateEPGBar(ch);
  } catch (e) {
    console.error(e);
    hideLoading();
    document.getElementById('npDot').classList.add('idle');
    showToast('Gagal: ' + ch.name);
  }
}

function buildConfig(ch) {
  const cfg = {
    streaming: {
      ignoreTextStreamFailures: true,
      rebufferingGoal: 2,
      bufferingGoal: 30,
      bufferBehind: 60,
      inaccurateManifestTolerance: 0.3,
      stallEnabled: false
    },
    manifest: {
      dash: { ignoreMinBufferTime: true, autoCorrectDrift: true }
    }
  };
  if (ch.clearKey) {
    cfg.drm = {
      clearKeys: { [ch.clearKey.keyId]: ch.clearKey.key }
    };
  }
  return cfg;
}

// ──────────────────────────────────────────────
// MULTI VIEW
// ──────────────────────────────────────────────
function toggleMultiMode() {
  multiMode = !multiMode;
  const btn = document.getElementById('multiBtn');
  btn.classList.toggle('active', multiMode);
  document.getElementById('sbMode').textContent = multiMode ? 'Multi' : 'Single';

  if (!multiMode) {
    // Switch back to single
    clearMulti();
    document.getElementById('singlePlayer').style.display = '';
    document.getElementById('multiGrid').style.display = 'none';
    document.getElementById('multiGrid').className = '';
    renderChannelList();
    showToast('Mode Single aktif');
  } else {
    showToast('Mode Multi aktif — klik + pada saluran');
    renderChannelList();
  }
}

async function addToMulti(ch) {
  if (multiPlayers.length >= 4) {
    showToast('Maksimal 4 saluran di multi-view');
    return;
  }

  // Switch to multi grid display
  document.getElementById('singlePlayer').style.display = 'none';
  const grid = document.getElementById('multiGrid');
  grid.style.display = 'grid';

  // Create cell
  const cell = document.createElement('div');
  cell.className = 'multiCell';
  const cellId = 'mc-' + Date.now();
  cell.id = cellId;

  const vid = document.createElement('video');
  vid.autoplay = true;
  vid.setAttribute('playsinline', '');
  vid.muted = multiPlayers.length > 0; // mute all except first

  const label = document.createElement('div');
  label.className = 'cellLabel';
  label.textContent = ch.name;

  const closeBtn = document.createElement('button');
  closeBtn.className = 'cellClose';
  closeBtn.textContent = '✕';
  closeBtn.addEventListener('click', () => removeMultiCell(cellId));

  cell.append(vid, label, closeBtn);
  cell.addEventListener('click', (e) => {
    if (e.target === closeBtn) return;
    // Unmute clicked, mute others
    multiPlayers.forEach(mp => mp.video.muted = true);
    vid.muted = false;
    document.querySelectorAll('.multiCell').forEach(c => c.classList.remove('focused'));
    cell.classList.add('focused');
  });

  grid.appendChild(cell);

  const count = multiPlayers.length + 1;
  grid.className = `grid-${Math.min(count, 4)}`;

  // Init player
  shaka.polyfill.installAll();
  const player = new shaka.Player(vid);
  player.configure(buildConfig(ch));

  try {
    await player.load(ch.url);
    showToast('+ ' + ch.name);
  } catch (e) {
    showToast('Gagal memuat: ' + ch.name);
  }

  multiPlayers.push({ player, video: vid, cellId, channel: ch });
  updateMultiGrid();
}

function removeMultiCell(cellId) {
  const idx = multiPlayers.findIndex(mp => mp.cellId === cellId);
  if (idx === -1) return;
  const mp = multiPlayers[idx];
  try { mp.player.destroy(); } catch {}
  document.getElementById(cellId)?.remove();
  multiPlayers.splice(idx, 1);
  updateMultiGrid();

  if (multiPlayers.length === 0) {
    document.getElementById('singlePlayer').style.display = '';
    document.getElementById('multiGrid').style.display = 'none';
  }
}

function updateMultiGrid() {
  const grid = document.getElementById('multiGrid');
  const n = multiPlayers.length;
  grid.className = n > 0 ? `grid-${Math.min(n, 4)}` : '';
}

function clearMulti() {
  multiPlayers.forEach(mp => { try { mp.player.destroy(); } catch {} });
  multiPlayers = [];
  document.getElementById('multiGrid').innerHTML = '';
}

// ──────────────────────────────────────────────
// EPG
// ──────────────────────────────────────────────
function toggleEPG() {
  epgOpen = !epgOpen;
  document.getElementById('epgPanel').classList.toggle('open', epgOpen);
}

function updateEPGBar(ch) {
  if (!ch.tvgId) return;
  const progs = epgData[ch.tvgId];
  if (!progs || !progs.length) return;
  const now = Date.now() / 1000;
  const current = progs.find(p => p.start <= now && p.end >= now);
  if (current) {
    document.getElementById('npEpg').textContent = '▌ ' + current.title;
  }
  showEPGForChannel(ch);
}

function showEPGForChannel(ch) {
  document.getElementById('epgChannelName').textContent = ch.name;
  const list = document.getElementById('epgList');
  const noData = document.getElementById('epgNoData');
  const progs = ch.tvgId ? epgData[ch.tvgId] : null;
  list.innerHTML = '';

  if (!progs || !progs.length) {
    noData.style.display = '';
    noData.textContent = 'Data EPG tidak tersedia untuk saluran ini';
    return;
  }

  noData.style.display = 'none';
  const now = Date.now() / 1000;

  progs.slice(0, 20).forEach(p => {
    const isNow = p.start <= now && p.end >= now;
    const item = document.createElement('div');
    item.className = 'epgItem' + (isNow ? ' now' : '');
    const startDate = new Date(p.start * 1000);
    const timeStr = startDate.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    item.innerHTML = `
      <div class="epgTime">${timeStr}${isNow ? '<span class="epgBadge">SEKARANG</span>' : ''}</div>
      <div class="epgTitle">${escHtml(p.title)}</div>
    `;
    list.appendChild(item);
  });
}

async function loadEPG() {
  if (!epgUrls.length) return;
  for (const url of epgUrls.slice(0, 3)) {
    try {
      const resp = await fetch('https://corsproxy.io/?' + encodeURIComponent(url));
      if (!resp.ok) continue;
      const text = await resp.text();
      parseEPGXML(text);
    } catch {}
  }
}

function parseEPGXML(xml) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xml, 'application/xml');
  const programmes = doc.querySelectorAll('programme');
  programmes.forEach(p => {
    const ch = p.getAttribute('channel');
    const start = parseEPGDate(p.getAttribute('start'));
    const end = parseEPGDate(p.getAttribute('stop') || p.getAttribute('end'));
    const titleEl = p.querySelector('title');
    const title = titleEl ? titleEl.textContent : '?';
    if (!epgData[ch]) epgData[ch] = [];
    epgData[ch].push({ start, end, title });
  });
}

function parseEPGDate(s) {
  if (!s) return 0;
  // Format: 20240101120000 +0700
  const m = s.match(/(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\s*([+-]\d{4})?/);
  if (!m) return 0;
  const offset = m[7] ? parseInt(m[7]) / 100 * 3600 : 0;
  const d = new Date(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}Z`);
  return d.getTime() / 1000 - offset;
}

// ──────────────────────────────────────────────
// UTILS
// ──────────────────────────────────────────────
function showLoading(msg) {
  const el = document.getElementById('loadingOverlay');
  el.classList.remove('hidden');
  document.getElementById('loadingText').textContent = msg || 'Memuat...';
}
function hideLoading() {
  document.getElementById('loadingOverlay').classList.add('hidden');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateClock() {
  const now = new Date();
  const str = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) +
    ' WIB';
  document.getElementById('sbTime').textContent = str;
}

// ──────────────────────────────────────────────
// EVENT LISTENERS
// ──────────────────────────────────────────────
document.getElementById('loadBtn').addEventListener('click', () => {
  const url = document.getElementById('urlInput').value.trim();
  if (url) loadPlaylist(url);
});

document.getElementById('urlInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('loadBtn').click();
});

document.getElementById('multiBtn').addEventListener('click', toggleMultiMode);

document.getElementById('epgBtn').addEventListener('click', toggleEPG);
document.getElementById('epgClose').addEventListener('click', () => {
  epgOpen = false;
  document.getElementById('epgPanel').classList.remove('open');
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderChannelList();
});

// ──────────────────────────────────────────────
// STARTUP
// ──────────────────────────────────────────────
window.addEventListener('load', async () => {
  await initShaka();
  updateClock();
  setInterval(updateClock, 1000);

  // Auto-load default playlist
  const defaultUrl = document.getElementById('urlInput').value.trim();
  if (defaultUrl) {
    setTimeout(() => loadPlaylist(defaultUrl), 500);
  }
});
</script>
